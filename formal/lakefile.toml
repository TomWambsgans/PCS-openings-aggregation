# The formal verification of `crates/quotient`. Toolchain and dependency revisions are those of leanerVM's
# `mumbai` branch (https://github.com/Verified-zkEVM/leanerVM, `lean_vm/lake-manifest.json` at 6175f1a0),
# so that its WHIR and random-permutation results can be imported. The proofs start from leanVM's
# `formal/quotient` (branch PCS-openings-aggregation, commit 651453c6). MIT OR Apache-2.0; see NOTICE.md.
name = "pcs-quotient-formal"
version = "0.1.0"
defaultTargets = ["QuotientSecurity", "QuotientRpm"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "afa6593f15e1e79ecb3cf22fc56191cecb452bb0"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "4dae3acff846125521b7b3998010885071746f16"

# leanerVM `mumbai`'s statement (the random-permutation model, Keccak-256 over a permutation) and
# `common` (the sponge's indifferentiability, the ROM-to-RPM transfer), at the commit whose
# dependency revisions this file pins. `QuotientRpm` uses them.
[[require]]
name = "statement"
git = "https://github.com/Verified-zkEVM/leanerVM"
rev = "6175f1a07f0dc33bd3d640de0063d1006143ee91"
subDir = "Statement"

[[require]]
name = "common"
git = "https://github.com/Verified-zkEVM/leanerVM"
rev = "6175f1a07f0dc33bd3d640de0063d1006143ee91"
subDir = "common"

# The deployed circuit (`formal/Circuit`, also a package of its own), which
# `QuotientSecurity/Deployed.lean` plugs into the end theorems.
[[lean_lib]]
name = "Circuit"
srcDir = "Circuit"
globs = ["Circuit", "Circuit.+"]

[[lean_lib]]
name = "QuotientSecurity"

# The reduction with the deployed transcript: the Keccak-256 chain of `crates/quotient/src/transcript.rs`,
# in the random-oracle model and then in leanerVM's random-permutation model.
[[lean_lib]]
name = "QuotientRpm"
