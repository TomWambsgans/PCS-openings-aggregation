# Part of this repository. Builds on crates/leanvm_flock_gas (which vendors and adapts leanVM
# (https://github.com/leanEthereum/leanVM), commit 42422001), MIT OR Apache-2.0. See NOTICE.md.
[package]
name = "leanvm_univariate"
version.workspace = true
edition.workspace = true
publish = false
description = "A univariate PIOP for leanVM 42422001 (two commitments, a product heap for the bus, quotient identities at one point): spec, soundness, verifier gas"

[lints]
workspace = true

[dependencies]
leanvm_flock_gas = { path = "../leanvm_flock_gas" }
revm.workspace = true
# The prover (src/prover): leanVM's WHIR (c445e3d5) and its verifier, the Cantor transforms of crates/quotient.
primitives.workspace = true
pcs.workspace = true
fiat_shamir.workspace = true
verifier.workspace = true
parallel.workspace = true
quotient.workspace = true
# The ring switch's twisted weight: GF(2)-linear maps of E, eight at once with GFNI.
gf2_linear = { path = "../gf2_linear" }
# Flock's prover: leanVM 42422001's, vendored (crates/lv42_*).
lv42_flock = { path = "../lv42_flock" }
lv42_fiat_shamir = { path = "../lv42_fiat_shamir" }
lv42_primitives = { path = "../lv42_primitives" }
lv42_parallel = { path = "../lv42_parallel" }

[dev-dependencies]
bench.workspace = true
lv42_pcs = { path = "../lv42_pcs" }
