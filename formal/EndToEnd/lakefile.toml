#
# The end-to-end workspace: the statements of `formal/Statement` (`PcsQuotient`: knowledge soundness,
# completeness, zero knowledge of the deployed membership proof, in mumbai's random-permutation
# model) proved from the proof layers of `formal/` (F0–F4: the circuit, the reduction, the openings,
# their composition). It builds as `Compose`, `Completeness` and `WhirBridge` do, against a built
# checkout of leanerVM (https://github.com/Verified-zkEVM/leanerVM, commit
# 6175f1a07f0dc33bd3d640de0063d1006143ee91) at `../leanervm`, sharing that checkout's `lean_vm`
# packages (Mathlib, VCVio, CompPoly, ArkLib, mumbai's `statement` and `common`), so nothing of them
# is fetched; the libraries of this repository are compiled from their sources in `formal/`
# (`srcDir`). Each end-to-end library has a root name of its own, distinct from the libraries it
# compiles from `formal/`.
name = "pcs-quotient-end-to-end"
version = "0.1.0"
defaultTargets = ["Soundness"]
packagesDir = "../leanervm/lean_vm/.lake/packages"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "lean-vm"
path = "../leanervm/lean_vm"

# ---- The libraries of `formal/`, compiled from their sources ----

# The reduction (F1) and the circuit's relation (F0a; F0b's deployed instance), `formal/QuotientSecurity`.
[[lean_lib]]
name = "QuotientSecurity"
srcDir = ".."

# The reduction's Keccak-256 chain (F4a), `formal/QuotientRpm`.
[[lean_lib]]
name = "QuotientRpm"
srcDir = ".."

# Zero knowledge (F3b), `formal/QuotientZk`.
[[lean_lib]]
name = "QuotientZk"
srcDir = ".."

# `F192` with the Rust's constructors and limbs, `formal/Field`.
[[lean_lib]]
name = "Field"
srcDir = ".."
globs = ["Field", "Field.+"]

# The implementation is the model (F5), `formal/Implementation`.
[[lean_lib]]
name = "Implementation"
srcDir = ".."

# The deployed circuit (F0b), `formal/Circuit`.
[[lean_lib]]
name = "Circuit"
srcDir = "../Circuit"
globs = ["Circuit", "Circuit.+"]

# The WHIR openings (F2), `formal/WhirBridge`.
[[lean_lib]]
name = "WhirBridge"
srcDir = "../WhirBridge"

# The composition (F4), `formal/Compose`.
[[lean_lib]]
name = "Compose"
srcDir = "../Compose"

# Completeness's proof layer, `formal/Completeness`.
[[lean_lib]]
name = "Completeness"
srcDir = "../Completeness"

# The reviewer-facing statement, `formal/Statement` (`PcsQuotient`; its test library is not built
# here).
[[lean_lib]]
name = "PcsQuotient"
srcDir = "../Statement"
globs = ["PcsQuotient", "PcsQuotient.+"]

# leanVM 42422001's VM (leanISA with `BLAKE2S`), its arithmetization (Clean's six tables), the
# abstract M3 instance with its Flock region, and the leanISA adaptor, ported from leanerVM
# `mumbai` at f0393df4 into the namespace `Lv42` (`formal/Lv42`): the statement the univariate
# PIOP for that leanVM proves against. It compiles against the same `lean_vm` package set
# (f0393df4 and 6175f1a0 pin the same Lean, Mathlib, CompPoly, Clean, ArkLib and VCVio).
[[lean_lib]]
name = "Lv42"
srcDir = "../Lv42"
globs = ["Lv42", "Lv42.+"]
leanOptions = { warningAsError = true }

# The univariate PIOP's bus (`crates/leanvm_univariate/SPEC.md` §5, branch `leanvm-univariate`) as a
# product heap, `formal/Heap`: the tree, leaf and root identities give the push and pull products'
# equality, which gives `Lv42`'s `Balanced` but with probability at most `4 N / |E|` over the bus
# challenges (leanerVM 6175f1a0's Theorem 5.1, `LeanVM.Protocol.sideProduct_collision`).
[[lean_lib]]
name = "Heap"
srcDir = "../Heap"
globs = ["Heap", "Heap.+"]
leanOptions = { warningAsError = true }

# ---- The end-to-end libraries ----

# `PcsQuotient.KnowledgeSoundness` from `Compose`'s random-permutation theorem (`Soundness.lean`,
# `Soundness/*.lean`).
[[lean_lib]]
name = "Soundness"

# `PcsQuotient.ZeroKnowledge` (`ZK.lean`, `ZK/*.lean`).
[[lean_lib]]
name = "ZK"

# The Statement's definitions are the proof layers' (`Bridge.lean`, `Bridge/*.lean`).
[[lean_lib]]
name = "Bridge"

# `PcsQuotient.Completeness` (`Completeness/E2ECompleteness.lean`,
# `Completeness/E2ECompleteness/*.lean`).
[[lean_lib]]
name = "E2ECompleteness"
srcDir = "Completeness"
globs = ["E2ECompleteness", "E2ECompleteness.+"]

# The deployed EVM contract is the statement's verifier (`Evm.lean`, `Evm/*.lean`): F5's recorded
# graph, run on the calldata of a statement's proof, calls `PCS_OPEN` exactly as `PcsQuotient.verifyWith`
# opens its claims.
[[lean_lib]]
name = "Evm"

# The univariate PIOP for leanVM 42422001 (`crates/leanvm_univariate`): its verifier transcribed
# (`formal/UniStatement`, library `UniStatement`) and its end statements against `Lv42`'s relation
# (`UniStatement.Security`). The differential runner (`UniStatementTest/Runner.lean`) runs with
# `lake env lean`, not built.
[[lean_lib]]
name = "UniStatement"
srcDir = "../UniStatement"
globs = ["UniStatement", "UniStatement.+"]
leanOptions = { warningAsError = true }

# Knowledge soundness of the univariate PIOP for leanVM 42422001, end to end (`formal/UniSound`):
# `UniStatement.UniKnowledgeSoundness` from `Compose`'s `k`-round chain, `Heap`'s bus and the
# Flock interface (`UniSound/FlockInterface.lean`, the one hypothesis about BLAKE2s by Flock).
[[lean_lib]]
name = "UniSound"
srcDir = "../UniSound"
globs = ["UniSound", "UniSound.+"]
leanOptions = { warningAsError = true }

# Flock's soundness (`crates/leanvm_flock_gas/src/flock_min.rs`, `crates/leanvm_univariate/SPEC-FLOCK.md`),
# `formal/FlockSound`: generic sumcheck, univariate-skip, lincheck and ring-switch soundness over the
# Boolean cube, then Flock's checks and claims give `Lv42`'s `FlockRegion.Holds` but for explicit bad
# challenges, each of a bounded number of values.
[[lean_lib]]
name = "FlockSound"
srcDir = "../FlockSound"
globs = ["FlockSound", "FlockSound.+"]

# Flock's interface instance (`formal/FlockSound/Interface`): the round-by-round state and errors of
# `UniSound.FlockSound` from `FlockSound`'s bad challenges.
[[lean_lib]]
name = "FlockSoundUni"
srcDir = "../FlockSound"
globs = ["FlockSoundUni", "FlockSoundUni.+"]

# The univariate PIOP's completeness (milestone 4, `formal/UniComplete`): the honest prover `uniProver` (a Lean
# prover following SPEC.md and the Rust prover's message order) and `UniCompleteness` for it. The differential
# runner (`UniCompleteTest/Runner.lean`) runs with `lake env lean`, not built.
[[lean_lib]]
name = "UniComplete"
srcDir = "../UniComplete"
globs = ["UniComplete", "UniComplete.+"]
leanOptions = { warningAsError = true }

# π2's PIOP, generic over circuits (`crates/leanvm_rec`, `PI2.md`, branch `leanvm-rec` @ 4247e37),
# `formal/RecPiop`: the circuit description and its `validate`, the copy argument in characteristic two
# (set-based logUp, every tag twice, the holes left out of the pulls), the quotient identity and its
# degrees, the dataflow lemma, and π2's rounds in `Compose.Piop`'s form (W → α, β, γ; Q → t; the values
# → ρ). No Fiat–Shamir layer, no openings.
[[lean_lib]]
name = "RecPiop"
srcDir = "../RecPiop"
globs = ["RecPiop", "RecPiop.+"]

# The recursion's inner verifier as a graph (`formal/RecGraph`): π1-rec3's recorded verifier graph
# (`crates/leanvm_rec/src/lean.rs` writes `RecGraph/Emitted.lean`, data only), its semantics over any permutation
# (`evalGraph`), and the Lean recorder with "recording commutes with evaluation". The differential runner
# (`RecGraphTest/Runner.lean`) runs with `lake env lean`, not built.
[[lean_lib]]
name = "RecGraph"
srcDir = "../RecGraph"
globs = ["RecGraph", "RecGraph.+"]
leanOptions = { warningAsError = true }

# π2's circuit (`crates/leanvm_rec/src/circuit`, branch `lean-rec-circuit`), `formal/RecCircuit`: the compiler from
# π1's recorded verifier graph to π2's circuit, transcribed, and the proof that a satisfied compiled circuit's ports
# carry the graph's outputs on the stream its free bits encode (the D16v Keccak-f template, Keccak-256's sponge, the
# `E` units, the packings).
[[lean_lib]]
name = "RecCircuit"
srcDir = "../RecCircuit"
globs = ["RecCircuit", "RecCircuit.+"]

# The differential runners' parser and printer (`RecCircuitTest/Parse.lean`).
[[lean_lib]]
name = "RecCircuitTest"
srcDir = "../RecCircuit"
roots = ["RecCircuitTest.Parse"]

# The differential runner of `formal/RecCircuit` against the Rust compiler (`RecCircuitTest/Main.lean`).
[[lean_exe]]
name = "rec-circuit-diff"
srcDir = "../RecCircuit"
root = "RecCircuitTest.Main"

# π2's verifier (`crates/leanvm_rec`, `PI2.md` §2, §8–§9, branch `leanvm-rec` @ 2b22581), `formal/RecStatement`:
# the verifier as computable Lean (its seed and IV, the public data in the stream, the arithmetic at `t` over any
# field, the six `PCS_OPEN` calls word for word), the circuit's tables as data the Rust emits
# (`crates/leanvm_rec/src/lean_statement.rs`, with a staleness test), the verifier-arithmetic lemmas `RecPiop`'s
# rounds consume, and the end statements of the recursive verifier against `Lv42`'s relation. The differential
# runner (`RecStatementTest/Runner.lean`) runs with `lake env lean`, not built.
[[lean_lib]]
name = "RecStatement"
srcDir = "../RecStatement"
globs = ["RecStatement", "RecStatement.+"]
leanOptions = { warningAsError = true }

# The recursive verifier's end theorems (`formal/RecCompose`): π2's part `RecStatement.RecKnowledgeSoundness2` from
# π2's layers (the Fiat–Shamir layer, the openings, `RecPiop`'s rounds, `RecCircuit`'s corollary), its bound in bits,
# and Part 1 ⇒ Part 2 (`RecKnowledgeSoundness`, `RecCompleteness` against `Lv42`'s relation, under the named
# hypotheses about π1-rec3 at Keccak-f[1600]).
[[lean_lib]]
name = "RecCompose"
srcDir = "../RecCompose"
globs = ["RecCompose", "RecCompose.+"]
leanOptions = { warningAsError = true }

# The compiler on `RecGraph.Emitted.graph` itself, against the Rust's circuit for π1-rec3 (`RecCircuitTest/Emitted.lean`).
[[lean_exe]]
name = "rec-circuit-emitted"
srcDir = "../RecCircuit"
root = "RecCircuitTest.Emitted"

# The view check of `RecCompose.Facts` (`Pi2ViewChecked`) on the compiler's circuit for π1-rec3
# (`RecComposeTest/ViewCheck.lean`).
[[lean_exe]]
name = "rec-view-check"
srcDir = "../RecCompose"
root = "RecComposeTest.ViewCheck"

# The real deployment's run-checked inputs (`RecCompose/RealDeployment.lean`: `DigestChecked`, `IvChecked` at three
# IVs, with `--setup` `SetupRootChecked`), evaluated (`RecComposeTest/RealCheck.lean`).
[[lean_exe]]
name = "rec-real-check"
srcDir = "../RecCompose"
root = "RecComposeTest.RealCheck"
